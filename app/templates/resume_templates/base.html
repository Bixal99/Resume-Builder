<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ full_name or 'Resume' }}</title>
    <base target="_blank">

    <!-- Google Fonts — Standard + User Options -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        {{ template_css }}
        
        /* User Formatting Overrides */
        {% if resume.theme_settings %}
        :root {
            --user-section-gap: {% if resume.theme_settings.section_spacing == 'compact' %}0.45rem{% elif resume.theme_settings.section_spacing == 'relaxed' %}1.1rem{% else %}0.65rem{% endif %};
            --user-line-height: {% if resume.theme_settings.line_spacing == 'tight' %}1.22{% elif resume.theme_settings.line_spacing == 'loose' %}1.6{% else %}1.38{% endif %};
            --user-font-scale: {% if resume.theme_settings.font_size == 'compact' %}0.88{% elif resume.theme_settings.font_size == 'tiny' %}0.82{% elif resume.theme_settings.font_size == 'large' %}1.05{% else %}0.96{% endif %};
            --user-page-padding: {% if resume.theme_settings.page_margin == 'compact' %}8mm 12mm{% elif resume.theme_settings.page_margin == 'relaxed' %}16mm 18mm{% else %}10mm 14mm{% endif %};
            {% if resume.theme_settings.font_family and resume.theme_settings.font_family != 'default' %}
            --font-heading: {{ resume.theme_settings.font_family | safe }} !important;
            --font-body: {{ resume.theme_settings.font_family | safe }} !important;
            --font-family: {{ resume.theme_settings.font_family | safe }} !important;
            {% endif %}
        }
        .resume-page {
            line-height: var(--user-line-height) !important;
            text-align: {{ resume.theme_settings.text_alignment or 'left' }} !important;
            padding: var(--user-page-padding) !important;
            font-size: calc(10pt * var(--user-font-scale, 1)) !important;
            {% if resume.theme_settings.font_family and resume.theme_settings.font_family != 'default' %}
            font-family: {{ resume.theme_settings.font_family | safe }} !important;
            {% endif %}
        }
        {% if resume.theme_settings.font_family and resume.theme_settings.font_family != 'default' %}
        body,
        .resume-page,
        .resume-page * {
            font-family: {{ resume.theme_settings.font_family | safe }} !important;
        }
        {% endif %}
        .resume-section {
            margin-bottom: var(--user-section-gap) !important;
        }
        .resume-section:last-child {
            margin-bottom: 0 !important;
        }
        {% endif %}

        /* Font Imports */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Open+Sans:wght@300;400;600;700&family=Lato:wght@300;400;700&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap');

        /* Clean, ATS-Safe Bullet Points */
        .entry-list,
        .skills-list,
        .summary-text ul,
        .entry-description ul,
        .section-content ul {
            list-style-type: disc !important;
            padding-left: 14px !important;
            margin: 2px 0 3px 0 !important;
        }
        .entry-list li,
        .skills-list li,
        .summary-text li,
        .entry-description li,
        .section-content li {
            margin-bottom: 2px !important;
            padding-left: 0 !important;
            line-height: 1.3 !important;
        }

        /* Skill Category Title Wrap & Alignment */
        .skill-category:has(.skill-tags) {
            display: flex !important;
            align-items: flex-start !important;
            gap: 12px !important;
            margin-bottom: 3px !important;
            padding-bottom: 3px !important;
        }
        .skill-category:has(.skill-tags) .skill-category-title {
            white-space: nowrap !important;
            line-height: 1.3 !important;
            flex: 0 0 160px !important;
            width: 160px !important;
            min-width: 145px !important;
            max-width: 175px !important;
            font-weight: 700 !important;
            font-size: 9pt !important;
            padding-top: 2px !important;
        }
        .skill-category:has(.skill-tags) .skill-tags {
            flex: 1 !important;
            min-width: 0 !important;
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 3px 6px !important;
        }
        .skill-tags .tag,
        .tech-tags .tag {
            display: inline-block !important;
            padding: 1.5px 7px !important;
            font-size: 8pt !important;
            border-radius: 4px !important;
            line-height: 1.3 !important;
        }

        /* Profile Photo Placement & Header Flow (Photo Up, Full-width 1-Line Contacts) */
        .resume-header {
            display: grid !important;
            grid-template-columns: 1fr auto !important;
            align-items: start !important;
            gap: 2px 14px !important;
            margin-bottom: 8px !important;
            padding-bottom: 6px !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }
        .header-content {
            display: contents !important;
        }
        .resume-name {
            grid-column: 1 / 2 !important;
            grid-row: 1 !important;
            padding-right: 0 !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
        }
        .resume-title {
            grid-column: 1 / 2 !important;
            grid-row: 2 !important;
            padding-right: 0 !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
        }
        .header-photo {
            grid-column: 2 / 3 !important;
            grid-row: 1 / 3 !important;
            justify-self: end !important;
            align-self: start !important;
            position: static !important;
            flex: 0 0 74px !important;
            width: 74px !important;
            height: 74px !important;
            margin: -4px 0 0 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 2 !important;
        }
        .profile-photo {
            width: 74px !important;
            height: 74px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            border: 2px solid var(--color-accent, #3b82f6) !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12) !important;
        }
        .contact-info {
            grid-column: 1 / -1 !important;
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
            display: flex !important;
            flex-wrap: wrap !important;
            align-items: center !important;
            gap: 3px 8px !important;
            font-size: 8pt !important;
            margin-top: 4px !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
        }
        .contact-item {
            display: inline-flex !important;
            align-items: center !important;
            white-space: normal !important;
            gap: 3.5px !important;
            line-height: 1.3 !important;
            font-size: 8pt !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
        }
        .contact-item .icon,
        .contact-item svg {
            width: 12px !important;
            height: 12px !important;
            vertical-align: middle !important;
            flex-shrink: 0 !important;
        }

        /* High-visibility, Clickable Preserved Hyperlinks */
        .contact-item a,
        a.contact-link,
        .entry-link,
        .project-link,
        .resume-link {
            color: var(--color-link, #2563eb) !important;
            text-decoration: underline !important;
            text-decoration-thickness: 1.2px !important;
            text-underline-offset: 2.5px !important;
            font-weight: 500 !important;
            cursor: pointer !important;
            transition: color 0.15s ease !important;
        }
        .contact-item a:hover,
        .entry-link:hover {
            color: #1d4ed8 !important;
            text-decoration: underline !important;
        }

        /* PDF Export & Print Fixes */
        @page {
            size: {{ page_size or 'A4' }};
            margin: 0;
        }
        @media print {
            html, body {
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
                height: auto !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .resume-page {
                margin: 0 auto !important;
                box-shadow: none !important;
                border: none !important;
                min-height: unset !important;
                height: auto !important;
                page-break-after: avoid !important;
                break-after: avoid !important;
            }
            .resume-section {
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .template-field-highlight {
                animation: none !important;
                background-color: transparent !important;
                outline: none !important;
                box-shadow: none !important;
            }
        }

        /* Real-Time Live Field Replacement Highlight */
        @keyframes templateFieldHighlight {
            0% {
                background-color: rgba(99, 102, 241, 0.28) !important;
                outline: 2.5px solid #6366f1 !important;
                box-shadow: 0 0 14px rgba(99, 102, 241, 0.35) !important;
                border-radius: 4px;
            }
            50% {
                background-color: rgba(16, 185, 129, 0.22) !important;
                outline: 2.5px solid #10b981 !important;
                box-shadow: 0 0 16px rgba(16, 185, 129, 0.4) !important;
                border-radius: 4px;
            }
            100% {
                background-color: transparent !important;
                outline: 2.5px solid transparent !important;
                box-shadow: none !important;
            }
        }
        .template-field-highlight {
            animation: templateFieldHighlight 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="resume-page" data-page-size="{{ page_size }}">
        {% block content %}
        <!-- Content is provided by child templates -->
        {% endblock %}
    </div>
</body>
</html>
